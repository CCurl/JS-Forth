<html>
  <head>
  <title>JS-Forth</title>
  </head>
  <body>
    <h1><a id="hdr" href="https://github.com/CCurl/JS-Forth" target="_blank">??</a></h1>
    <div style="display: flex; gap: 10px; align-items: flex-start;">
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <table>
        <tr>
          <th><h2>Input (Select + Ctrl-Enter)</h2></th>
          <th><h2>Output</h2></th>
          <th><h2><span>Block <pre id="blk-num">??</pre></span></h2></th>
        </tr>
        <tr>
          <td><textarea id="forth-hist" rows="25" cols="49"
            onkeydown="if (event.ctrlKey && event.key==='Enter'){ execSelected(); }"></textarea>
          </td>
          <td><textarea id="forth-output" rows="25" cols="64" readonly></textarea></td>
          <td><textarea id="forth-block"  rows="25" cols="64" readonly></textarea></td>
        </tr>
        <tr>
          <td colspan="3">
            <label><b>Command:</b> </label>
            <input type="text" id="forth-input" size="80" autofocus
              onkeydown="if (event.key==='Enter'){ runCommand(); }">
            </input>
          </td>
        </tr>
      </table>
    </div>
    <script src="./jsforth.js"></script>
    <script type="application/forth">
      : version s" JS-Forth v2026.10.10" ; : cr 10 emit ;
      version s" hdr" html!
      ( s" words" s" forth-hist" html! )
      : banner version type ."  - Chris Curl" cr cr ." Hello." cr ;
      banner cr words  0 list
    </script>
    <script>
      function execSelected() {
        var ta = document.getElementById('forth-hist');
        var sel = ta.value.substring(ta.selectionStart, ta.selectionEnd);
        if (sel) runForth(sel);
      }
      function runCommand() {
        var inp = document.getElementById('forth-input');
        var ta = document.getElementById('forth-hist');
        ta.value += inp.value + '\n';
        runForth(inp.value);
        inp.value = '';
      }
    </script>
  </body>
  <style>
    body {
      font-family: monospace;
    }

    h2 {
      text-align: left;
      margin: 0;
    }

    pre {
      display: inline;
      margin: 0;
    }

    #forth-input {
      height: 1.8em;
      padding: 4px;
    }

    label {
      font-size: 1.5em;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #e0e0e0;
      }
      textarea, input {
        background-color: #2d2d2d;
        color: #e0e0e0;
        border: 1px solid #444;
      }
    }
  </style>
</html>
