<html>
  <head>
  <title>JS-Forth</title>
  </head>
  <body>
    <h1>JS-Forth v2026.10.04 - Chris Curl</h1>
    <div style="display: flex; gap: 10px; align-items: flex-start;">
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <table>
        <tr>
          <th><h2>History</h2></th>
          <th><h2>Output</h2></th>
          <th><h2>Block</h2></th>
        </tr>
        <tr>
          <td><textarea id="forth-hist" rows="25" cols="32" autofocus
            onkeydown="if (event.ctrlKey && event.key==='Enter') { execHist(); }"></textarea></td>
          <td><textarea id="forth-output" rows="25" cols="64" readonly></textarea></td>
          <td><textarea id="forth-block"  rows="25" cols="64" readonly></textarea></td>
        </tr>
      </table>
    </div>
    <script src="./jsforth.js"></script>
    <script type="application/forth">
      ." JS-Forth v2026.10.04 - Chris Curl"
      : cr 10 emit ; cr cr ." hello."
    </script>
    <script>
      function repl() {
        var ln = document.getElementById('forth-tib').value;
        document.getElementById('forth-tib').value='';
        runForth(ln);
        document.getElementById('forth-hist').value += ln + '\n';
      }
      function execHist() {
        var ta = document.getElementById('forth-hist');
        var sel = ta.value.substring(ta.selectionStart, ta.selectionEnd);
        if (sel) runForth(sel);
      }
    </script>
  </body>
  <style>
    body {
      font-family: monospace;
    }

    h2 {
      text-align: left;
      margin: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #e0e0e0;
      }
      textarea, input {
        background-color: #2d2d2d;
        color: #e0e0e0;
        border: 1px solid #444;
      }
    }
  </style>
</html>
